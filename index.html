  CartesianGrid, Tooltip, Legend, ResponsiveContainer, ReferenceLine, ReferenceDot } = Recharts;

/* ============================ FORMATTAZIONE ============================ */
const fmtEur = (n) => new Intl.NumberFormat('it-IT', { style:'currency', currency:'EUR', maximumFractionDigits:0 }).format(Number.isFinite(n)?n:0);
const fmtEur2 = (n) => new Intl.NumberFormat('it-IT', { style:'currency', currency:'EUR', minimumFractionDigits:2, maximumFractionDigits:2 }).format(Number.isFinite(n)?n:0);
const fmtNum = (n,d=0) => new Intl.NumberFormat('it-IT', { minimumFractionDigits:d, maximumFractionDigits:d }).format(Number.isFinite(n)?n:0);
const fmtPct = (n,d=1) => fmtNum(n,d) + '%';

/* ============================ COSTANTI ============================ */
const ALIQUOTE_IMU = { prima_casa:0, seconda_casa:0.0106, locato_concordato:0.0076 };
const RATE_PLAT = { booking:0.17, airbnb:0.03, diretti:0 };
const COLORI_SCEN = ['#0a1f3d', '#c5a028', '#1f9d55', '#8e44ad'];
const COLORI_PIE = ['#0a1f3d','#13294b','#c5a028','#e0bd4a','#1f9d55','#16a085','#c0392b','#7f8c8d','#2980b9','#8e44ad'];

/* ============================ FINANZA ============================ */
function valoreCatastale(rendita, primaCasa){ return rendita * 1.05 * (primaCasa ? 115.5 : 126); }
function impostaRegistro(rendita, primaCasa){
  const vc = valoreCatastale(rendita, primaCasa);
  return Math.max(vc * (primaCasa ? 0.02 : 0.09), 1000);
}
function calcImu(rendita, primaCasa, aliquota){ return primaCasa ? 0 : rendita * 1.05 * 160 * aliquota; }
function rataMutuo(P, tassoAnnuo, anni){
  const r = tassoAnnuo/12, n = anni*12;
  if(P<=0 || n<=0) return 0;
  if(r===0) return P/n;
  return P * (r*Math.pow(1+r,n)) / (Math.pow(1+r,n)-1);
}
function debitoResiduo(P, tassoAnnuo, anni, annoT){
  const r = tassoAnnuo/12, n = anni*12, m = Math.min(Math.round(annoT*12), n);
  if(P<=0) return 0;
  if(r===0) return Math.max(P*(1-m/n),0);
  const rata = rataMutuo(P,tassoAnnuo,anni);
  const bal = P*Math.pow(1+r,m) - rata*(Math.pow(1+r,m)-1)/r;
  return Math.max(bal,0);
}
function irpefTax(reddito){
  const sc=[[28000,.23],[50000,.35],[Infinity,.43]];
  let tax=0, prev=0;
  for(const [cap,al] of sc){
    if(reddito>prev){ tax += (Math.min(reddito,cap)-prev)*al; prev=cap; } else break;
  }
  return tax;
}
function irr(flussi, guessLo=-0.95, guessHi=1.5){
  const npv=(r)=> flussi.reduce((a,cf,t)=> a + cf/Math.pow(1+r,t), 0);
  let lo=guessLo, hi=guessHi, flo=npv(lo), fhi=npv(hi);
  if(flo*fhi>0) return null; // nessun cambio di segno nel range
  for(let i=0;i<200;i++){
    const mid=(lo+hi)/2, fm=npv(mid);
    if(Math.abs(fm)<1e-6) return mid;
    if(flo*fm<0){ hi=mid; fhi=fm; } else { lo=mid; flo=fm; }
  }
  return (lo+hi)/2;
}

/* ============================ CALCOLO SCENARIO ============================ */
function effComm(mix){
  const tot = (mix.booking+mix.airbnb+mix.diretti)||1;
  return (mix.booking*RATE_PLAT.booking + mix.airbnb*RATE_PLAT.airbnb + mix.diretti*RATE_PLAT.diretti)/tot;
}
function computeScenario(sc, ctx, overrides={}){
  const { acquisto, mutuo, costiFissi, fiscale } = ctx;
  const occMul = overrides.occMul ?? 1;
  const adrMul = overrides.adrMul ?? 1;
  const tassoOv = overrides.tasso ?? mutuo.tasso;

  // --- Ricavi B&B ---
  let bnbRicavo=0, notti=0;
  (sc.bnbCamere||[]).forEach(c=>{
    const occ = Math.min(c.occ*occMul, 1);
    const n = 365*occ;
    notti += n;
    bnbRicavo += n * c.adr * adrMul;
  });
  const comm = effComm(sc.mix);
  const commissioni = bnbRicavo * comm;
  const cambi = sc.durataMedia>0 ? notti/sc.durataMedia : 0;
  const pulizie = cambi * sc.costoPulizia;
  const hasBnb = (sc.bnbCamere||[]).length>0;
  const biancheria = hasBnb ? sc.biancheriaMese*12 : 0;
  const utenzeBnb = hasBnb ? sc.utenzeMese*12 : 0;

  // --- Ricavi affitto ---
  let affittoRicavo=0;
  (sc.affittoStanze||[]).forEach(s=>{ affittoRicavo += s.canone*(12 - s.vacancy); });
  const hasAff = (sc.affittoStanze||[]).length>0;
  const utenzeAff = hasAff ? sc.affUtenzeMese*12 : 0;

  const ricavoLordo = bnbRicavo + affittoRicavo;
  const costiVariabili = commissioni + pulizie + biancheria + utenzeBnb + utenzeAff;

  // --- Costi fissi ---
  const imuVal = costiFissi.imuAuto
    ? calcImu(acquisto.rendita, acquisto.primaCasa, costiFissi.aliquotaImu)
    : costiFissi.imuManuale;
  const assicurazione = costiFissi.assicBnb ? costiFissi.assicBnbVal : costiFissi.assicurazione;
  const sommaFissi = imuVal + costiFissi.tari + costiFissi.condominio + assicurazione
    + costiFissi.manutenzione + costiFissi.commercialista;
  const pmCost = costiFissi.pmOn ? ricavoLordo*costiFissi.pmPercent : 0;

  // --- Tasse sul reddito ---
  let tasse=0, regimeLabel='';
  if(fiscale.regime==='ced21'){ tasse = ricavoLordo*0.21; regimeLabel='Cedolare 21%'; }
  else if(fiscale.regime==='ced26'){ tasse = ricavoLordo*0.26; regimeLabel='Cedolare 26%'; }
  else if(fiscale.regime==='irpef'){
    const base = Math.max(ricavoLordo - costiVariabili - sommaFissi - pmCost, 0);
    tasse = irpefTax(fiscale.redditoComplessivo + base) - irpefTax(fiscale.redditoComplessivo);
    regimeLabel='IRPEF marginale';
  } else if(fiscale.regime==='forfettario'){
    tasse = ricavoLordo*0.40*0.15; regimeLabel='Forfettario (caveat)';
  }

  const nettoAnteMutuo = ricavoLordo - costiVariabili - sommaFissi - pmCost - tasse;
  const rataAnnua = mutuo.enabled ? rataMutuo(mutuo.importo, tassoOv, mutuo.durata)*12 : 0;
  const cashFlow = nettoAnteMutuo - rataAnnua;

  // --- Investimento ---
  const registro = impostaRegistro(acquisto.rendita, acquisto.primaCasa);
  const agenzia = acquisto.agenziaPercent ? acquisto.prezzo*acquisto.agenziaPctVal : acquisto.agenzia;
  const investimentoTotale = acquisto.prezzo + acquisto.notaio + agenzia + registro + 50 + 50 + acquisto.lavori;
  const investimentoCash = investimentoTotale - (mutuo.enabled ? mutuo.importo : 0);

  const yieldLordo = acquisto.prezzo>0 ? ricavoLordo/acquisto.prezzo*100 : 0;
  const yieldNetto = investimentoTotale>0 ? nettoAnteMutuo/investimentoTotale*100 : 0;
  const breakEven = cashFlow>0 ? investimentoCash/cashFlow : null;

  return {
    ricavoLordo, bnbRicavo, affittoRicavo, notti, cambi,
    commissioni, pulizie, biancheria, utenzeBnb, utenzeAff, costiVariabili,
    imuVal, assicurazione, sommaFissi, pmCost, tasse, regimeLabel,
    nettoAnteMutuo, rataAnnua, cashFlow, cashFlowMese: cashFlow/12,
    registro, agenzia, investimentoTotale, investimentoCash,
    yieldLordo, yieldNetto, breakEven,
    costiFissiDettaglio: { imuVal, tari:costiFissi.tari, condominio:costiFissi.condominio,
      assicurazione, manutenzione:costiFissi.manutenzione, commercialista:costiFissi.commercialista }
  };
}

/* ============================ COSTO-OPPORTUNITÀ (ETF) ============================ */
function computeETF(r, st){
  const anni = Math.min(st.proiezioni.annoUscita, st.proiezioni.orizzonte);
  const etfRate = 0.07; // rendimento storico medio azionario globale, lordo
  const etfFinale = r.investimentoCash * Math.pow(1+etfRate, anni);
  let cfCum = 0;
  for(let t=1;t<=anni;t++) cfCum += r.cashFlow; // prudente: cash flow costante
  const valore = st.acquisto.prezzo * Math.pow(1+st.proiezioni.rivalutazione, anni);
  const debito = st.mutuo.enabled ? debitoResiduo(st.mutuo.importo, st.mutuo.tasso, st.mutuo.durata, anni) : 0;
  const equity = valore - debito - st.acquisto.prezzo*0.03; // -3% costi di vendita
  const bnbFinale = cfCum + equity;
  return { anni, etfRate, etfFinale, bnbFinale, diff: bnbFinale - etfFinale, cfCum, equity };
}

/* ============================ DEAL SCORE (brutale, oggettivo) ============================ */
function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }
function computeDealScore(r, st){
  const bonus = [];
  const malus = [];

  // --- BONUS ---
  const cfPts = r.cashFlow>=0 ? clamp(r.cashFlowMese/600, 0, 1)*35 : 0;
  bonus.push(['Soldi che ti restano ogni mese', cfPts, 35]);

  const yPts = clamp(r.yieldNetto/6, 0, 1)*25;
  bonus.push(['Quanto rende l’anno', yPts, 25]);

  const etf = computeETF(r, st);
  const etfPts = etf.etfFinale>0 ? clamp(etf.bnbFinale/etf.etfFinale, 0, 1)*25 : 0;
  bonus.push(['Meglio che metterli in borsa?', etfPts, 25]);

  const bePts = r.breakEven ? clamp((25 - r.breakEven)/15, 0, 1)*15 : 0;
  bonus.push(['Quanto in fretta ti torna l’investito', bePts, 15]);

  // --- MALUS oggettivi ---
  malus.push(['È un seminterrato (umidità, difficile da rivendere)', -10]);
  const occMedia = avgOcc(st.scenarios[0]);
  if(occMedia>0.85) malus.push(['Conti troppo ottimisti: lo dai pieno oltre l’85%', -12]);
  else if(occMedia>0.80) malus.push(['Conti tirati: lo dai pieno oltre l’80%', -7]);
  const ltv = st.mutuo.enabled && st.acquisto.prezzo>0 ? st.mutuo.importo/st.acquisto.prezzo : 0;
  if(ltv>0.8) malus.push(['Troppo mutuo: oltre l’80% del prezzo', -5]);
  if(r.yieldNetto<3.5) malus.push(['Rende meno dei titoli di Stato', -8]);

  const totBonus = bonus.reduce((a,b)=>a+b[1],0);
  const totMalus = malus.reduce((a,b)=>a+b[1],0);
  const score = Math.round(clamp(totBonus + totMalus, 0, 100));

  let label, color, frase;
  if(score<=25){ label='🗑️ SPAZZATURA'; color='#7a1f12'; frase='Non comprare. Bruci soldi ogni mese.'; }
  else if(score<=45){ label='🔴 PESSIMO'; color='#c0392b'; frase='Affare da fessi. I numeri non girano.'; }
  else if(score<=60){ label='🟠 MEDIOCRE'; color='#d68910'; frase='Margine sottile, tanto lavoro per poco.'; }
  else if(score<=75){ label='🟡 DISCRETO'; color='#c5a028'; frase='Funziona, ma non ti cambia la vita.'; }
  else if(score<=88){ label='🟢 BUONO'; color='#1f9d55'; frase='Affare solido. I numeri tornano.'; }
  else { label='💎 ORO'; color='#0e7a4a'; frase='Compra e ringrazia. Raro a questo prezzo.'; }

  return { score, label, color, frase, bonus, malus, etf };
}
function avgOcc(sc){
  const cam = (sc.bnbCamere||[]); if(!cam.length) return 0;
  return cam.reduce((a,c)=>a+c.occ,0)/cam.length;
}

/* ============================ STATO DEFAULT ============================ */
const DEFAULT_STATE = {

    primaCasa:false, lavori:5000, rendita:1084.56 },
  mutuo: { enabled:true, importo:300000, ltv:1.0, tasso:0.04, durata:25, tipo:'fisso' },
  costiFissi: { imuAuto:true, aliquotaImu:0.0106, imuManuale:1931, tari:400, condominio:1800,
    assicurazione:500, assicBnb:false, assicBnbVal:800, manutenzione:1500, commercialista:600,
    pmOn:false, pmPercent:0.20 },
  fiscale: { regime:'ced21', redditoComplessivo:30000, impostaSoggiorno:3.5 },
  proiezioni: { rivalutazione:0.02, crescitaRicavi:0.03, inflazioneCosti:0.025, annoUscita:10, orizzonte:25 },
  scenarios: [
    { id:1, nome:'B&B 3 camere — scenario base', tipo:'bnb',
      bnbCamere:[ {adr:90,occ:0.8,bagnoPrivato:true}, {adr:70,occ:0.8,bagnoPrivato:false}, {adr:70,occ:0.8,bagnoPrivato:false} ],
      mix:{booking:100,airbnb:0,diretti:0}, durataMedia:3, costoPulizia:25, biancheriaMese:150, utenzeMese:400,
      affittoStanze:[], affUtenzeMese:150 }
  ]

const STORAGE_KEY = 'bnb-simulator-boiardo-v1';
function loadState(){
  try { const s = localStorage.getItem(STORAGE_KEY); if(s) return {...DEFAULT_STATE, ...JSON.parse(s)}; } catch(e){}
  return DEFAULT_STATE;

/* ============================ UI KIT ============================ */
function Card({children, className=''}){ return <div className={`bg-white rounded-xl shadow-sm border border-gray-100 p-5 ${className}`}>{children}</div>; }
function SectionTitle({children, sub}){ return (<div className="mb-4"><h3 className="text-navy font-bold text-lg">{children}</h3>{sub && <p className="text-sm text-gray-500 mt-0.5">{sub}</p>}</div>); }
function Info({text}){ const [o,setO]=useState(false);
  return <span className="relative inline-block ml-1 align-middle">
    <span onMouseEnter={()=>setO(true)} onMouseLeave={()=>setO(false)} className="cursor-help text-gold text-xs border border-gold rounded-full w-4 h-4 inline-flex items-center justify-center">i</span>
    {o && <span className="absolute z-50 left-5 top-0 w-56 bg-navy text-white text-xs rounded-lg p-2 shadow-lg">{text}</span>}
  </span>; }

function Num({label, value, onChange, suffix='€', step=100, min=0, max, info, decimals=false}){
  return (<div className="mb-3">
    <label className="block text-sm text-gray-600 mb-1">{label}{info && <Info text={info}/>}</label>
    <div className="flex items-center border border-gray-200 rounded-lg overflow-hidden focus-within:border-gold">
      <input type="number" value={value} step={step} min={min} max={max}
        onChange={e=>{ let v = e.target.value===''?0:(decimals?parseFloat(e.target.value):parseFloat(e.target.value)); if(min!=null&&v<min)v=min; onChange(Number.isNaN(v)?0:v); }}
        className="flex-1 px-3 py-2 outline-none text-navy font-medium w-full" />
      <span className="px-3 text-gray-400 text-sm bg-gray-50 py-2">{suffix}</span>
    </div>
  </div>);
}
function Slider({label, value, onChange, min, max, step, fmt, info}){
  return (<div className="mb-4">
    <div className="flex justify-between text-sm mb-1">
      <span className="text-gray-600">{label}{info && <Info text={info}/>}</span>
      <span className="text-navy font-bold">{fmt? fmt(value): value}</span>
    </div>
    <input type="range" min={min} max={max} step={step} value={value} onChange={e=>onChange(parseFloat(e.target.value))} className="w-full" />
  </div>);
}
function Toggle({label, value, onChange, labelOn, labelOff}){
  return (<div className="flex items-center justify-between mb-3 gap-3">
    <span className="text-sm text-gray-600">{label}</span>
    <div className="inline-flex rounded-lg bg-gray-100 p-0.5 text-xs font-semibold shrink-0">
      <button onClick={()=>onChange(false)} className={`px-3 py-1.5 rounded-md transition ${!value?'bg-white text-navy shadow-sm':'text-gray-400'}`}>{labelOff}</button>
      <button onClick={()=>onChange(true)} className={`px-3 py-1.5 rounded-md transition ${value?'bg-navy text-white shadow-sm':'text-gray-400'}`}>{labelOn}</button>
    </div>
  </div>);
}
function ResultBar({r}){
  const ok = r.cashFlow>=0;
  return (<div className="no-print sticky top-0 z-30 mb-5 bg-white/95 backdrop-blur rounded-xl shadow-sm border border-gray-100 px-4 py-2.5 flex flex-wrap gap-x-5 gap-y-1 items-center text-sm">
    <span className="font-bold text-navy">Scenario base</span>
    <span className="text-gray-500">In tasca <b className={ok?'text-pos':'text-neg'}>{fmtEur(r.cashFlowMese)}/mese</b></span>
    <span className="text-gray-500">Rendimento netto <b className={r.yieldNetto<3?'text-neg':'text-navy'}>{fmtPct(r.yieldNetto)}</b></span>
    <span className="text-gray-500">Rientro <b className="text-navy">{r.breakEven?fmtNum(r.breakEven,1)+' anni':'mai'}</b></span>
    <span className={`ml-auto px-2.5 py-0.5 rounded-full text-xs font-bold ${ok?'bg-green-100 text-pos':'bg-red-100 text-neg'}`}>{ok?'✅ Sostenibile':'❌ In perdita'}</span>
  </div>);
}
function Select({label, value, onChange, options, info}){
  return (<div className="mb-3">
    <label className="block text-sm text-gray-600 mb-1">{label}{info && <Info text={info}/>}</label>
    <select value={value} onChange={e=>onChange(e.target.value)} className="w-full px-3 py-2 border border-gray-200 rounded-lg outline-none focus:border-gold text-navy font-medium bg-white">
      {options.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
    </select>
  </div>);
}
function KPI({label, value, sub, tone='neutral', big}){
  const toneCls = tone==='pos'?'text-pos':tone==='neg'?'text-neg':'text-navy';
  return (<div className={`bg-white rounded-xl border border-gray-100 shadow-sm p-4 ${big?'col-span-2':''}`}>
    <div className="text-xs text-gray-500 uppercase tracking-wide">{label}</div>
    <div className={`font-extrabold ${big?'text-3xl':'text-xl'} ${toneCls} mt-1`}>{value}</div>
    {sub && <div className="text-xs text-gray-400 mt-1">{sub}</div>}
  </div>);
}

/* ============================ TOOLTIP CHART ============================ */
function ChartTip({active, payload, label, isEur=true}){
  if(!active||!payload||!payload.length) return null;
  return (<div className="bg-navy text-white text-xs rounded-lg p-2 shadow-lg">
    <div className="font-bold mb-1">{label}</div>
    {payload.map((p,i)=><div key={i} style={{color:p.color}}>{p.name}: {isEur?fmtEur(p.value):fmtNum(p.value)}</div>)}
  </div>);
}

function App(){
  const [st, setSt] = useState(loadState);
  const [page, setPage] = useState('parametri');
  const [mode, setMode] = useState(()=>{ try{ return localStorage.getItem(STORAGE_KEY+'-mode')||'semplice'; }catch(e){ return 'semplice'; } });
  const [whatif, setWhatif] = useState({ occ:80, tasso:4.0, adr:100 });

  useEffect(()=>{ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(st)); }catch(e){} }, [st]);
  useEffect(()=>{ try{ localStorage.setItem(STORAGE_KEY+'-mode', mode); }catch(e){} }, [mode]);

  const set = (key)=>(patch)=> setSt(s=>({...s, [key]: typeof patch==='function'?patch(s[key]):{...s[key],...patch}}));
  const setAcq = set('acquisto'), setMut = set('mutuo'), setFissi = set('costiFissi'), setFisc = set('fiscale'), setProi = set('proiezioni');

  const ctx = useMemo(()=>({acquisto:st.acquisto, mutuo:st.mutuo, costiFissi:st.costiFissi, fiscale:st.fiscale}), [st]);
  const results = useMemo(()=> st.scenarios.map(sc=> ({sc, r:computeScenario(sc, ctx)})), [st.scenarios, ctx]);
  const base = results[0];

  const resetAll = ()=>{ if(confirm('Ripristinare tutti i valori di default?')) setSt(DEFAULT_STATE); };

  const NAV = [
    ['parametri','① Parametri'], ['scenari','② Scenari reddito'], ['costi','③ Costi & Tasse'],
    ['dashboard','④ Dashboard'], ['proiezioni','⑤ Proiezioni 25 anni']
  ];

  if(mode==='semplice') return <PageSemplice st={st} setSt={setSt} base={base} goAdvanced={()=>setMode('avanzato')} resetAll={resetAll} />;

  return (<div className="min-h-screen flex flex-col md:flex-row">
    {/* SIDEBAR */}
    <aside className="no-print md:w-64 bg-navy text-white md:min-h-screen p-5 md:sticky md:top-0 md:h-screen flex flex-col">
      <div className="flex items-center gap-2 mb-1">
        <span className="text-gold text-2xl">🏛️</span>
        <span className="font-extrabold text-lg">B&B Simulator</span>
      </div>
      <div className="text-xs text-gray-300 mb-6 leading-tight">Via Matteo Boiardo 12/B<br/>Roma 00185 · Seminterrato A/2</div>
      <nav className="space-y-1 flex-1">
        {NAV.map(([k,l])=>(
          <button key={k} onClick={()=>setPage(k)} className={`w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition ${page===k?'bg-gold text-navy':'hover:bg-navy2 text-gray-200'}`}>{l}</button>
        ))}
      </nav>
      <div className="mt-4 pt-4 border-t border-navy2 space-y-2">
        <div className="bg-navy2 rounded-lg p-3">
          <div className="text-[10px] uppercase text-gray-400">In tasca scenario base</div>
          <div className={`font-extrabold text-lg ${base.r.cashFlow>=0?'text-gold2':'text-red-400'}`}>{fmtEur(base.r.cashFlowMese)}/mese</div>
        </div>
        <button onClick={()=>setMode('semplice')} className="w-full text-xs bg-gold text-navy font-semibold rounded-lg py-2 transition hover:bg-gold2">← Torna alla modalità semplice</button>
        <button onClick={()=>window.print()} className="w-full text-xs bg-navy2 hover:bg-gold hover:text-navy rounded-lg py-2 transition">🖨️ Esporta PDF</button>
        <button onClick={resetAll} className="w-full text-xs text-gray-400 hover:text-white py-1">↺ Reset default</button>
      </div>
      <div className="text-[10px] text-gray-500 mt-3">Domenico × Luca · uso interno</div>
    </aside>

    {/* MAIN */}
    <main className="flex-1 p-4 md:p-8 max-w-6xl mx-auto w-full">
      <ResultBar r={base.r} />
      {page==='parametri' && <PageParametri st={st} setAcq={setAcq} setMut={setMut} base={base} ctx={ctx} />}
      {page==='scenari' && <PageScenari st={st} setSt={setSt} results={results} />}
      {page==='costi' && <PageCosti st={st} setFissi={setFissi} setFisc={setFisc} base={base} />}
      {page==='dashboard' && <PageDashboard st={st} results={results} />}
      {page==='proiezioni' && <PageProiezioni st={st} setProi={setProi} base={base} ctx={ctx} whatif={whatif} setWhatif={setWhatif} />}
    </main>
  </div>);
}

/* ============================ MODALITÀ SEMPLICE (a prova di bimbo) ============================ */
function BigSlider({label, value, display, min, max, step, onChange}){
  return (<div>
    <div className="flex justify-between items-baseline mb-1">
      <span className="text-sm md:text-base text-gray-600 font-medium">{label}</span>
      <span className="text-lg md:text-xl font-extrabold text-navy">{display}</span>
    </div>
    <input type="range" min={min} max={max} step={step} value={value} onChange={e=>onChange(parseFloat(e.target.value))} className="w-full h-2" />
  </div>);
}
function PageSemplice({st, setSt, base, goAdvanced, resetAll}){
  const r = base.r;
  const deal = computeDealScore(r, st);
  const etf = deal.etf;
  const sc0 = st.scenarios[0];

  const mutuoPct = (st.mutuo.enabled && st.acquisto.prezzo>0) ? st.mutuo.importo/st.acquisto.prezzo : (st.mutuo.enabled?0.8:0);
  const adr = sc0.bnbCamere.length ? Math.round(sc0.bnbCamere.reduce((a,c)=>a+c.adr,0)/sc0.bnbCamere.length) : 80;
  const occ = avgOcc(sc0);
  const nCam = sc0.bnbCamere.length;

  const setPrezzo = (v)=> setSt(s=>({...s, acquisto:{...s.acquisto, prezzo:v}, mutuo:{...s.mutuo, importo:Math.round(v*mutuoPct)} }));
  const setMutuoPct = (p)=> setSt(s=>({...s, mutuo:{...s.mutuo, enabled:p>0, importo:Math.round(s.acquisto.prezzo*p)} }));
  const setTasso = (v)=> setSt(s=>({...s, mutuo:{...s.mutuo, tasso:v} }));
  const setAdr = (v)=> setSt(s=>({...s, scenarios:s.scenarios.map((sc,i)=> i===0?{...sc, bnbCamere:sc.bnbCamere.map(c=>({...c, adr:v}))}:sc)}));
  const setOcc = (v)=> setSt(s=>({...s, scenarios:s.scenarios.map((sc,i)=> i===0?{...sc, bnbCamere:sc.bnbCamere.map(c=>({...c, occ:v}))}:sc)}));
  const setNCam = (n)=> setSt(s=>({...s, scenarios:s.scenarios.map((sc,i)=>{
    if(i!==0) return sc;
    const arr=[]; for(let k=0;k<n;k++) arr.push(sc.bnbCamere[k] || {adr, occ, bagnoPrivato:k===0});
    return {...sc, bnbCamere:arr};
  })}));

  const ok = r.cashFlow>=0;

  return (<div className="min-h-screen bg-gradient-to-b from-navy to-navy2 text-white">
    <div className="max-w-2xl mx-auto px-4 py-6">
      {/* header */}
      <div className="flex justify-between items-center mb-6">
        <div>
          <div className="text-gold font-extrabold text-lg">🏛️ Conviene questo B&B?</div>
          <div className="text-xs text-gray-300">Via Matteo Boiardo 12/B, Roma · seminterrato</div>
        </div>
        <button onClick={goAdvanced} className="text-xs bg-white/10 hover:bg-white/20 rounded-lg px-3 py-2 transition">⚙️ Avanzata</button>
      </div>

      {/* DEAL SCORE GIGANTE */}
      <div className="rounded-2xl p-6 mb-5 text-center" style={{background:deal.color}}>
        <div className="text-sm uppercase tracking-widest text-white/70">Voto dell'affare</div>
        <div className="text-7xl md:text-8xl font-black leading-none my-1">{deal.score}<span className="text-3xl text-white/60">/100</span></div>
        <div className="text-2xl font-extrabold mt-1">{deal.label}</div>
        <div className="text-base text-white/90 mt-2">{deal.frase}</div>
      </div>

      {/* 3 NUMERI CHE CONTANO */}
      <div className="grid grid-cols-3 gap-3 mb-5">
        <BigStat label="In tasca al mese" value={fmtEur(r.cashFlowMese)} tone={ok}/>
        <BigStat label="Rende l'anno" value={fmtPct(r.yieldNetto)} tone={r.yieldNetto>=3.5}/>
        <BigStat label="Rientri in" value={r.breakEven?fmtNum(r.breakEven,0)+' anni':'MAI'} tone={!!r.breakEven}/>
      </div>

      {/* CONFRONTO CON LA BORSA, brutale */}
      <div className={`rounded-2xl p-5 mb-5 ${etf.diff>=0?'bg-green-900/40 border border-green-500/40':'bg-red-900/40 border border-red-500/40'}`}>
        <div className="text-sm text-gray-300 mb-1">E se invece mettessi gli stessi {fmtEur(r.investimentoCash)} in borsa (un fondo che rende il 7% l’anno)?</div>
        <div className="text-lg font-bold leading-snug">
          {etf.diff>=0
            ? <>Tra {etf.anni} anni col B&B avresti <span className="text-green-300">{fmtEur(etf.bnbFinale)}</span>, in borsa {fmtEur(etf.etfFinale)}. Guadagni <span className="text-green-300">{fmtEur(etf.diff)}</span> in più della borsa — ma devi lavorarci.</>
            : <>Tra {etf.anni} anni in borsa avresti <span className="text-red-300">{fmtEur(etf.etfFinale)}</span>, col B&B solo {fmtEur(etf.bnbFinale)}. Stai <span className="text-red-300">buttando {fmtEur(-etf.diff)}</span> per il piacere di fare il portiere.</>}
        </div>
      </div>

      {/* PERCHÉ QUESTO VOTO (trasparenza brutale) */}
      <div className="bg-white/5 rounded-2xl p-5 mb-5">
        <div className="text-sm font-semibold text-gold mb-2">Perché questo voto (niente sconti)</div>
        <div className="space-y-1 text-sm">
          {deal.bonus.map(([l,p,max],i)=>(
            <div key={'b'+i} className="flex justify-between"><span className="text-gray-300">{l}</span><span className="font-semibold text-green-300">+{Math.round(p)}<span className="text-gray-500">/{max}</span></span></div>
          ))}
          {deal.malus.map(([l,p],i)=>(
            <div key={'m'+i} className="flex justify-between"><span className="text-gray-300">{l}</span><span className="font-semibold text-red-300">{p}</span></div>
          ))}
        </div>
      </div>

      {/* LE 6 LEVE */}
      <div className="bg-white rounded-2xl p-5 text-navy">
        <div className="text-sm font-bold text-navy mb-4">Cambia i numeri — il voto si aggiorna da solo</div>
        <div className="space-y-5">
          <BigSlider label="Prezzo di acquisto" value={st.acquisto.prezzo} display={fmtEur(st.acquisto.prezzo)} min={150000} max={450000} step={5000} onChange={setPrezzo}/>
          <BigSlider label="Quanto mutuo (% del prezzo)" value={mutuoPct} display={mutuoPct===0?'In contanti, niente mutuo':fmtPct(mutuoPct*100,0)} min={0} max={1} step={0.05} onChange={setMutuoPct}/>
          {mutuoPct>0 && <BigSlider label="Tasso del mutuo" value={st.mutuo.tasso} display={fmtPct(st.mutuo.tasso*100,2)} min={0.01} max={0.07} step={0.0005} onChange={setTasso}/>}
          <BigSlider label="Numero di camere" value={nCam} display={nCam+(nCam===1?' camera':' camere')} min={1} max={4} step={1} onChange={setNCam}/>
          <BigSlider label="Prezzo medio a notte" value={adr} display={fmtEur(adr)} min={40} max={160} step={5} onChange={setAdr}/>
          <BigSlider label="Quanto è piena (occupazione)" value={occ} display={fmtPct(occ*100,0)} min={0.4} max={0.95} step={0.01} onChange={setOcc}/>
        </div>
        <div className="text-[11px] text-gray-400 mt-4 leading-snug">
          Tutto il resto (tasse, IMU, pulizie, condominio) è già impostato su valori realistici per Roma. Per cambiarli o confrontare più scenari → <button onClick={goAdvanced} className="underline text-navy font-semibold">Modalità avanzata</button>.
        </div>
      </div>

      <div className="flex justify-between items-center mt-5 text-xs text-gray-400">
        <button onClick={resetAll} className="hover:text-white">↺ Reset</button>
        <button onClick={()=>window.print()} className="hover:text-white">🖨️ Salva PDF</button>
      </div>
      <div className="text-center text-[11px] text-gray-500 mt-3">Stima per orientarti. Verifica i numeri col commercialista prima di firmare.</div>
    </div>
  </div>);
}
function BigStat({label, value, tone}){
  return (<div className="bg-white/10 rounded-xl p-3 text-center">
    <div className="text-[11px] text-gray-300 uppercase">{label}</div>
    <div className={`text-xl md:text-2xl font-black mt-0.5 ${tone?'text-green-300':'text-red-300'}`}>{value}</div>
  </div>);
}

/* ============================ PAGINA 1: PARAMETRI ============================ */
function PageParametri({st, setAcq, setMut, base, ctx}){
  const a = st.acquisto, m = st.mutuo;
  const vc = valoreCatastale(a.rendita, a.primaCasa);
  const registro = impostaRegistro(a.rendita, a.primaCasa);
  const agenzia = a.agenziaPercent ? a.prezzo*a.agenziaPctVal : a.agenzia;
  const totInv = base.r.investimentoTotale;
  const rataM = m.enabled ? rataMutuo(m.importo, m.tasso, m.durata) : 0;
  const nRate = m.durata*12;
  const totRestituito = rataM*nRate;
  const totInteressi = totRestituito - m.importo;

  return (<div>
    <h2 className="text-2xl font-bold text-navy mb-1">① Parametri investimento</h2>
    <p className="text-gray-500 mb-6">Tutto modificabile. I calcoli si aggiornano in tempo reale.</p>

    <div className="grid md:grid-cols-2 gap-6">
      {/* ACQUISTO */}
      <Card>
        <SectionTitle sub="Prezzo, oneri e imposte di trasferimento">Acquisto</SectionTitle>
        <Slider label="Prezzo di acquisto" value={a.prezzo} min={200000} max={400000} step={5000} fmt={fmtEur} onChange={v=>setAcq({prezzo:v})}/>
        <Toggle label="Regime fiscale acquisto" value={a.primaCasa} labelOn="Prima casa" labelOff="Investimento" onChange={v=>setAcq({primaCasa:v})}/>
        <Num label="Costi notaio" value={a.notaio} onChange={v=>setAcq({notaio:v})} step={100}/>
        <Toggle label="Agenzia: importo o %" value={a.agenziaPercent} labelOn="% sul prezzo" labelOff="Importo €" onChange={v=>setAcq({agenziaPercent:v})}/>
        {a.agenziaPercent
          ? <Slider label="Provvigione agenzia" value={a.agenziaPctVal} min={0} max={0.06} step={0.005} fmt={v=>fmtPct(v*100)} onChange={v=>setAcq({agenziaPctVal:v})}/>
          : <Num label="Costi agenzia" value={a.agenzia} onChange={v=>setAcq({agenzia:v})} step={500}/> }
        <Num label="Lavori iniziali" value={a.lavori} onChange={v=>setAcq({lavori:v})} step={500} info="Ristrutturazione / messa a norma B&B"/>

        <div className="bg-gray-50 rounded-lg p-3 mt-2 text-sm space-y-1">
          <div className="font-semibold text-navy mb-1">Imposta di registro (calcolo)</div>
          <Row k="Rendita catastale" v={fmtEur2(a.rendita)}/>
          <Row k={`× 1,05 × ${a.primaCasa?'115,5':'126'}`} v={fmtEur(vc)} note="valore catastale"/>
          <Row k={`× ${a.primaCasa?'2%':'9%'} (min €1.000)`} v={fmtEur(registro)} bold/>
          <Row k="Imposta ipotecaria" v={fmtEur(50)}/>
          <Row k="Imposta catastale" v={fmtEur(50)}/>
          <p className="text-[11px] text-gray-400 pt-1">Coefficiente seconda casa cat. A: 126 (rendita×1,05×126). Alcuni usano 120 — qui 126 per prudenza.</p>
        </div>
        <div className="bg-navy text-white rounded-lg p-3 mt-3 flex justify-between items-center">
          <span className="text-sm">Totale investimento</span>
          <span className="font-extrabold text-xl text-gold2">{fmtEur(totInv)}</span>
        </div>
        <div className="flex justify-between text-sm mt-2 text-gray-600">
          <span>Di tasca tua (senza il mutuo)</span><span className="font-bold text-navy">{fmtEur(base.r.investimentoCash)}</span>
        </div>
      </Card>

      {/* MUTUO */}
      <Card>
        <SectionTitle sub="Ammortamento alla francese">Mutuo</SectionTitle>
        <Toggle label="Finanziamento" value={m.enabled} labelOn="Con mutuo" labelOff="Cash" onChange={v=>setMut({enabled:v})}/>
        {m.enabled && <>
          <Slider label="Importo mutuo" value={m.importo} min={50000} max={400000} step={5000} fmt={fmtEur} onChange={v=>setMut({importo:v})}/>
          {m.importo>a.prezzo && <div className="text-xs text-neg -mt-2 mb-2">⚠️ Mutuo &gt; prezzo: solo se include ristrutturazione.</div>}
          <div className="text-xs text-gray-500 -mt-2 mb-3">Finanzi col mutuo il {fmtPct(a.prezzo>0?m.importo/a.prezzo*100:0,0)} del prezzo</div>
          <Slider label="Tasso annuo" value={m.tasso} min={0.01} max={0.07} step={0.0005} fmt={v=>fmtPct(v*100,2)} onChange={v=>setMut({tasso:v})}/>
          <Slider label="Durata" value={m.durata} min={10} max={30} step={1} fmt={v=>v+' anni'} onChange={v=>setMut({durata:v})}/>
          <Toggle label="Tipo tasso" value={m.tipo==='variabile'} labelOn="Variabile" labelOff="Fisso" onChange={v=>setMut({tipo:v?'variabile':'fisso'})}/>
          {m.tipo==='variabile' && <div className="text-xs text-gold -mt-1 mb-2">ℹ️ Calcoli indicativi: il tasso variabile cambia nel tempo.</div>}

          <div className="bg-gray-50 rounded-lg p-3 mt-2 text-sm space-y-1">
            <Row k="Rata mensile" v={fmtEur2(rataM)} bold/>
            <Row k="Rata annua" v={fmtEur(rataM*12)}/>
            <Row k="Totale interessi" v={fmtEur(totInteressi)}/>
            <Row k="Totale restituito" v={fmtEur(totRestituito)}/>
          </div>
        </>}
        {!m.enabled && <div className="text-sm text-gray-500 bg-gray-50 rounded-lg p-4">Acquisto in contanti: nessuna rata, ma esborso cash pieno di {fmtEur(base.r.investimentoTotale)}.</div>}
      </Card>

      {/* PROPRIETÀ */}
      <Card className="md:col-span-2">
        <SectionTitle sub="Dati catastali e configurazione camere (modificabili per scenario nella pagina ②)">Proprietà</SectionTitle>
        <div className="grid md:grid-cols-2 gap-x-8">
          <Num label="Rendita catastale" value={a.rendita} onChange={v=>setAcq({rendita:v})} step={10} decimals info="Base per IMU e imposta di registro"/>
          <div className="text-sm bg-gray-50 rounded-lg p-3">
            <div className="font-semibold text-navy mb-1">Immobile</div>
            <Row k="Superficie catastale" v="148 mq"/>
            <Row k="Vani / Altezza" v="5 vani · 3,10 m"/>
            <Row k="Foglio/Part./Sub." v="510 / 35 / 509"/>
            <Row k="Disposizione" v="2 cam + 2 bagni"/>
          </div>
        </div>
      </Card>
    </div>
  </div>);
}
function Row({k,v,note,bold}){ return (<div className="flex justify-between"><span className="text-gray-500">{k}{note&&<span className="text-[10px] text-gray-400 ml-1">{note}</span>}</span><span className={bold?'font-bold text-navy':'text-navy'}>{v}</span></div>); }

/* ============================ PAGINA 2: SCENARI ============================ */
function PageScenari({st, setSt, results}){
  const updScen = (idx, patch)=> setSt(s=>({...s, scenarios: s.scenarios.map((sc,i)=> i===idx?{...sc,...patch}:sc)}));
  const addScen = ()=>{ if(st.scenarios.length>=4) return;
    const id = Math.max(...st.scenarios.map(s=>s.id))+1;
    setSt(s=>({...s, scenarios:[...s.scenarios, {...JSON.parse(JSON.stringify(DEFAULT_STATE.scenarios[0])), id, nome:`Scenario ${s.scenarios.length+1}`}]}));
  };
  const delScen = (idx)=> setSt(s=>({...s, scenarios: s.scenarios.filter((_,i)=>i!==idx)}));

  return (<div>
    <div className="flex justify-between items-center mb-1">
      <h2 className="text-2xl font-bold text-navy">② Scenari di reddito</h2>
      <button onClick={addScen} disabled={st.scenarios.length>=4} className="no-print bg-navy text-white text-sm px-4 py-2 rounded-lg disabled:opacity-40 hover:bg-navy2">+ Aggiungi scenario ({st.scenarios.length}/4)</button>
    </div>
    <p className="text-gray-500 mb-6">Configura fino a 4 scenari. Si confrontano nella Dashboard.</p>

    <div className="space-y-6">
      {st.scenarios.map((sc, idx)=>(
        <ScenarioEditor key={sc.id} sc={sc} idx={idx} color={COLORI_SCEN[idx]} r={results[idx].r}
          onUpd={p=>updScen(idx,p)} onDel={st.scenarios.length>1?()=>delScen(idx):null}/>
      ))}
    </div>
  </div>);
}

function ScenarioEditor({sc, idx, color, r, onUpd, onDel}){
  const updCamera = (ci, patch)=> onUpd({bnbCamere: sc.bnbCamere.map((c,i)=>i===ci?{...c,...patch}:c)});
  const addCamera = ()=> sc.bnbCamere.length<4 && onUpd({bnbCamere:[...sc.bnbCamere, {adr:70,occ:0.8,bagnoPrivato:false}]});
  const delCamera = (ci)=> onUpd({bnbCamere: sc.bnbCamere.filter((_,i)=>i!==ci)});
  const updStanza = (si, patch)=> onUpd({affittoStanze: sc.affittoStanze.map((s,i)=>i===si?{...s,...patch}:s)});
  const addStanza = ()=> sc.affittoStanze.length<4 && onUpd({affittoStanze:[...sc.affittoStanze, {canone:650, vacancy:1, bagnoPrivato:false}]});
  const delStanza = (si)=> onUpd({affittoStanze: sc.affittoStanze.filter((_,i)=>i!==si)});

  const showBnb = sc.tipo==='bnb' || sc.tipo==='misto';
  const showAff = sc.tipo==='affitto' || sc.tipo==='misto';
  const mixTot = sc.mix.booking+sc.mix.airbnb+sc.mix.diretti;

  return (<Card>
    <div className="flex items-center gap-3 mb-4 border-b border-gray-100 pb-3">
      <span className="w-3 h-3 rounded-full" style={{background:color}}></span>
      <input value={sc.nome} onChange={e=>onUpd({nome:e.target.value})} className="font-bold text-navy text-lg outline-none flex-1 bg-transparent"/>
      <div className={`text-sm font-bold px-3 py-1 rounded-lg ${r.cashFlow>=0?'bg-green-50 text-pos':'bg-red-50 text-neg'}`}>{fmtEur(r.cashFlowMese)}/mese</div>
      {onDel && <button onClick={onDel} className="no-print text-gray-300 hover:text-neg text-xl">×</button>}
    </div>

    <div className="grid md:grid-cols-2 gap-6">
      <div>
        <Select label="Tipo di utilizzo" value={sc.tipo} onChange={v=>onUpd({tipo:v})} options={[
          {value:'bnb',label:'B&B / Affitti brevi'},{value:'affitto',label:'Affitto tradizionale'},{value:'misto',label:'Misto'}
        ]}/>

        {showBnb && <div className="mt-2">
          <div className="flex justify-between items-center mb-2">
            <span className="text-sm font-semibold text-navy">Camere B&B</span>
            <button onClick={addCamera} disabled={sc.bnbCamere.length>=4} className="no-print text-xs text-navy border border-navy rounded px-2 py-0.5 disabled:opacity-30">+ camera</button>
          </div>
          {sc.bnbCamere.map((c,ci)=>(
            <div key={ci} className="bg-gray-50 rounded-lg p-3 mb-2">
              <div className="flex justify-between items-center mb-2">
                <span className="text-xs font-semibold text-gray-600">Camera {ci+1}</span>
                <div className="flex items-center gap-2">
                  <label className="text-[11px] text-gray-500 flex items-center gap-1"><input type="checkbox" checked={c.bagnoPrivato} onChange={e=>updCamera(ci,{bagnoPrivato:e.target.checked})}/> bagno privato</label>
                  {sc.bnbCamere.length>1 && <button onClick={()=>delCamera(ci)} className="no-print text-gray-300 hover:text-neg">×</button>}
                </div>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div><div className="text-[11px] text-gray-500">Prezzo a notte (€)</div>
                  <input type="number" value={c.adr} onChange={e=>updCamera(ci,{adr:parseFloat(e.target.value)||0})} className="w-full px-2 py-1 border rounded text-sm"/></div>
                <div><div className="text-[11px] text-gray-500">Occupazione {fmtPct(c.occ*100,0)}</div>
                  <input type="range" min={0.5} max={0.95} step={0.01} value={c.occ} onChange={e=>updCamera(ci,{occ:parseFloat(e.target.value)})} className="w-full"/></div>
              </div>
            </div>
          ))}

          <div className="bg-gray-50 rounded-lg p-3 mt-1">

/* ============================ VERDETTO ============================ */
function Verdict({r, st}){
  const ok = r.cashFlow>=0;
  const strong = ok && r.yieldNetto>=3;
  let titolo, tono, bg;
  if(!ok){ titolo='❌ Investimento NON sostenibile'; tono='text-neg'; bg='bg-red-50 border-neg'; }
  else if(!strong){ titolo='⚠️ Sostenibile ma poco redditizio'; tono='text-gold'; bg='bg-gold/10 border-gold'; }
  else { titolo='✅ Investimento sostenibile e redditizio'; tono='text-pos'; bg='bg-green-50 border-pos'; }

  const punti = [];
  punti.push(ok
    ? `Genera ${fmtEur(r.cashFlowMese)}/mese di cassa netta dopo aver pagato tutto (tasse e rata mutuo inclusi).`
    : `Brucia ${fmtEur(-r.cashFlowMese)}/mese: dovresti aggiungere soldi di tasca tua ogni mese.`);
  punti.push(r.yieldNetto>=3
    ? `Rende il ${fmtPct(r.yieldNetto)} netto sul capitale investito — sopra i titoli di stato.`
    : `Rende solo il ${fmtPct(r.yieldNetto)} netto: meno di un BTP, con molto più rischio e lavoro.`);
  punti.push(r.breakEven
    ? `Recuperi i ${fmtEur(r.investimentoCash)} di cash iniziale in ${fmtNum(r.breakEven,1)} anni.`
    : `Senza cash flow positivo, il capitale iniziale non si recupera con la gestione.`);
  if(st.mutuo.enabled) punti.push(`La rata mutuo pesa ${fmtEur(r.rataAnnua)}/anno: è la voce di costo più grande.`);

  return (<div className={`rounded-xl border ${bg} p-5 mb-6`}>
    <div className={`text-xl font-extrabold ${tono} mb-2`}>{titolo}</div>
    <ul className="space-y-1 text-sm text-navy/90">
      {punti.map((p,i)=><li key={i} className="flex gap-2"><span className="text-gold">•</span><span>{p}</span></li>)}
    </ul>
  </div>);
}

/* ============================ PAGINA 5: PROIEZIONI ============================ */
function PageProiezioni({st, setProi, base, ctx, whatif, setWhatif}){
  const p = st.proiezioni;
  const sc = base.sc;
  const m = st.mutuo;

  // proiezione anno per anno
  const proj = useMemo(()=>{
    const rows=[];
    for(let t=1;t<=p.orizzonte;t++){
      const gRic = Math.pow(1+p.crescitaRicavi, t-1);
      const gCost = Math.pow(1+p.inflazioneCosti, t-1);
      const r0 = base.r;
      const ricavo = r0.ricavoLordo*gRic;
      const costiOp = (r0.costiVariabili)*gCost;
      const costiFissi = r0.sommaFissi*gCost;
      const pm = r0.pmCost*gRic;
      // tasse ricalcolate (cedolare su lordo; irpef approssimata scalando)
      let tasse;
      if(st.fiscale.regime==='ced21') tasse=ricavo*0.21;
      else if(st.fiscale.regime==='ced26') tasse=ricavo*0.26;
      else if(st.fiscale.regime==='forfettario') tasse=ricavo*0.40*0.15;
      else { const baseImp=Math.max(ricavo-costiOp-costiFissi-pm,0); tasse=irpefTax(st.fiscale.redditoComplessivo+baseImp)-irpefTax(st.fiscale.redditoComplessivo); }
      const netto = ricavo-costiOp-costiFissi-pm-tasse;
      const rata = (m.enabled && t<=m.durata)? r0.rataAnnua : 0;
      const cf = netto-rata;
      const valore = ctx.acquisto.prezzo*Math.pow(1+p.rivalutazione,t);
      const debito = m.enabled? debitoResiduo(m.importo,m.tasso,m.durata,t):0;
      rows.push({anno:t, ricavo, costiTot:costiOp+costiFissi+pm+tasse, netto, rata, cf, debito, valore, equity:valore-debito});
    }
    return rows;
  }, [st, base, ctx, p]);

  // IRR con uscita all'anno annoUscita
  const irrVal = useMemo(()=>{
    const X = Math.min(p.annoUscita, p.orizzonte);
    const flussi=[-base.r.investimentoCash];
    for(let t=1;t<=X;t++){
      const row=proj[t-1];
      let cf=row.cf;
      if(t===X) cf += (row.valore - row.debito) - (ctx.acquisto.prezzo*0.03); // valore uscita netto ~3% costi vendita
      flussi.push(cf);
    }
    return irr(flussi);
  }, [proj, base, p, ctx]);

  // WHAT-IF live sul scenario base
  const wifBase = computeScenario(sc, ctx);
  const wif = computeScenario(sc, ctx, { occMul: whatif.occ/80, tasso: whatif.tasso/100, adrMul: whatif.adr/100 });

  return (<div>
    <h2 className="text-2xl font-bold text-navy mb-1">⑤ Proiezioni & simulazioni</h2>
    <p className="text-gray-500 mb-6">Orizzonte {p.orizzonte} anni sul scenario base "{sc.nome}".</p>

    <Card className="mb-6">
      <SectionTitle>Parametri di proiezione</SectionTitle>
      <div className="grid md:grid-cols-4 gap-x-8">
        <Slider label="Rivalutazione immobile/anno" value={p.rivalutazione} min={0} max={0.05} step={0.005} fmt={v=>fmtPct(v*100)} onChange={v=>setProi({rivalutazione:v})}/>
        <Slider label="Crescita ricavi/anno" value={p.crescitaRicavi} min={0} max={0.05} step={0.005} fmt={v=>fmtPct(v*100)} onChange={v=>setProi({crescitaRicavi:v})}/>
        <Slider label="Inflazione costi/anno" value={p.inflazioneCosti} min={0} max={0.05} step={0.005} fmt={v=>fmtPct(v*100)} onChange={v=>setProi({inflazioneCosti:v})}/>
        <Slider label="Anno in cui rivendi" value={p.annoUscita} min={3} max={p.orizzonte} step={1} fmt={v=>v+' anni'} onChange={v=>setProi({annoUscita:v})}/>
      </div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mt-3">
        <KPI label={`Rende l\u2019anno (se rivendi al ${p.annoUscita}\u00b0)`} value={irrVal!=null? fmtPct(irrVal*100):'n/d'} tone={irrVal>0.05?'pos':irrVal>0?'neutral':'neg'} sub="tutto incluso, anche la rivendita"/>
        <KPI label={`Quanto \u00e8 tuo (anno ${p.annoUscita})`} value={fmtEur(proj[Math.min(p.annoUscita,p.orizzonte)-1].equity)} sub="valore casa meno debito"/>
        <KPI label={`Valore immobile anno ${p.orizzonte}`} value={fmtEur(proj[p.orizzonte-1].valore)}/>
        <KPI label="Soldi accumulati nel tempo" value={fmtEur(proj.slice(0,p.annoUscita).reduce((a,r)=>a+r.cf,0))} sub={`primi ${p.annoUscita} anni`}/>
      </div>
    </Card>

    <Card className="mb-6">
      <SectionTitle sub="Quando il verde supera il rosso, la casa vale pi\u00f9 di quanto devi alla banca">Valore della casa contro debito del mutuo</SectionTitle>
      <ResponsiveContainer width="100%" height={280}>
        <LineChart data={proj}>
          <CartesianGrid strokeDasharray="3 3" stroke="#eee"/>
          <XAxis dataKey="anno" tick={{fontSize:11}}/>
          <YAxis tick={{fontSize:11}} tickFormatter={v=>fmtNum(v/1000)+'k'}/>
          <Tooltip content={<ChartTip/>}/>
          <Line type="monotone" dataKey="valore" name="Valore della casa" stroke="#1f9d55" strokeWidth={2} dot={false}/>
          <Line type="monotone" dataKey="debito" name="Debito del mutuo" stroke="#c0392b" strokeWidth={2} dot={false}/>
          <Line type="monotone" dataKey="equity" name="Quanto \u00e8 tuo" stroke="#c5a028" strokeWidth={2} dot={false}/>
          <Legend wrapperStyle={{fontSize:11}}/>
        </LineChart>
      </ResponsiveContainer>
    </Card>

    {/* WHAT IF */}
    <Card className="mb-6">
      <SectionTitle sub="Sposta i cursori: i soldi in tasca si aggiornano subito">E se cambiasse qualcosa?</SectionTitle>
      <div className="grid md:grid-cols-3 gap-x-8 mb-4">
        <Slider label="Occupazione" value={whatif.occ} min={40} max={95} step={1} fmt={v=>v+'%'} onChange={v=>setWhatif({...whatif,occ:v})}/>
        <Slider label="Tasso mutuo" value={whatif.tasso} min={1} max={7} step={0.1} fmt={v=>fmtNum(v,1)+'%'} onChange={v=>setWhatif({...whatif,tasso:v})}/>
        <Slider label="Prezzo a notte (variazione)" value={whatif.adr} min={60} max={140} step={1} fmt={v=>v+'%'} onChange={v=>setWhatif({...whatif,adr:v})}/>
      </div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <KPI label="In tasca oggi" value={fmtEur(wifBase.cashFlowMese)+'/mese'} tone={wifBase.cashFlow>=0?'pos':'neg'}/>
        <KPI label="In tasca così" value={fmtEur(wif.cashFlowMese)+'/mese'} tone={wif.cashFlow>=0?'pos':'neg'}/>
        <KPI label="Differenza" value={fmtEur(wif.cashFlowMese-wifBase.cashFlowMese)+'/mese'} tone={(wif.cashFlow-wifBase.cashFlow)>=0?'pos':'neg'}/>
        <KPI label="Ricavo lordo sim." value={fmtEur(wif.ricavoLordo)}/>
      </div>
      <div className="grid md:grid-cols-3 gap-3 mt-3 text-sm">
        <WhatBox q="Occupazione al 60%?" calc={()=>{const w=computeScenario(sc,ctx,{occMul:60/80}); return w;}}/>
        <WhatBox q="Tasso mutuo al 6%?" calc={()=>computeScenario(sc,ctx,{tasso:0.06})}/>
        <WhatBox q="Prezzo a notte −20%?" calc={()=>computeScenario(sc,ctx,{adrMul:0.8})}/>
      </div>
    </Card>

    {/* TABELLA 25 ANNI */}
    <Card>
      <SectionTitle>Proiezione anno per anno</SectionTitle>
      <div className="overflow-x-auto max-h-96 overflow-y-auto">
        <table className="w-full text-xs">
          <thead className="sticky top-0 bg-white"><tr className="text-gray-500 border-b text-right">
            <th className="py-2 text-left">Anno</th><th>Ricavo</th><th>Costi tot.</th><th>Netto</th><th>Rata</th><th>In tasca</th><th>Debito mutuo</th><th>Valore casa</th><th>Quanto \u00e8 tuo</th>
          </tr></thead>
          <tbody>
            {proj.map(row=>(
              <tr key={row.anno} className="border-b border-gray-50 text-right">
                <td className="py-1 text-left font-medium text-navy">{row.anno}</td>
                <td>{fmtEur(row.ricavo)}</td><td>{fmtEur(row.costiTot)}</td><td>{fmtEur(row.netto)}</td>
                <td>{fmtEur(row.rata)}</td>
                <td className={row.cf>=0?'text-pos font-semibold':'text-neg font-semibold'}>{fmtEur(row.cf)}</td>
                <td className="text-neg">{fmtEur(row.debito)}</td><td className="text-pos">{fmtEur(row.valore)}</td>
                <td className="font-semibold text-navy">{fmtEur(row.equity)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </Card>
  </div>);
}
function WhatBox({q, calc}){
  const r = calc();
  return (<div className={`rounded-lg p-3 border ${r.cashFlow>=0?'border-green-200 bg-green-50':'border-red-200 bg-red-50'}`}>
    <div className="text-gray-600 text-xs mb-1">{q}</div>
    <div className={`font-bold ${r.cashFlow>=0?'text-pos':'text-neg'}`}>{fmtEur(r.cashFlowMese)}/mese</div>
    <div className="text-[11px] text-gray-500">yield netto {fmtPct(r.yieldNetto)}</div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
